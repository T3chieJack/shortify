<!doctype html>
<html lang="en">
<head>
  {{ head }}
  <title>{{ label }} - Shortify</title>
  <script src="/dashboard.js" defer></script>
  <script src="/charts.js" defer></script>
</head>
<body>
  <div class="app">
    {{ sidebar }}

    <main class="main">
      <div class="page-head">
        <h1 class="link-title">{{ label }}</h1>
        <form class="page-actions" method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <input type="hidden" name="id" value="{{ id }}">
          <button class="button button-small button-quiet" type="submit" formaction="/links/edit">Edit</button>
          <button class="button button-small button-quiet button-quiet-danger" type="submit" formaction="/links/delete">Delete</button>
        </form>
      </div>

      <div class="columns link-columns">
        <div class="column column-side">
          <section class="card card-qr">
            <h2>QR code</h2>
            <img class="qr-image" src="/links/qr?id={{ id }}" alt="QR code that opens {{ short_url }}" width="240" height="240">
            <a class="card-link" href="/links/qr?id={{ id }}&amp;download=1">Download SVG</a>
          </section>

          <section class="card">
            <h2>Details</h2>
            <dl class="details">
              {{ details }}
            </dl>
          </section>
        </div>

        <div class="column column-main">
          <section class="card">
            <div class="field created">
              <label for="short-url">Short link</label>
              <div class="copy-wrap">
                <input id="short-url" type="text" readonly value="{{ short_url }}">
                <button class="toggle" id="copy" type="button" hidden>Copy</button>
              </div>
            </div>
          </section>

          <section class="card card-clicks" aria-label="Clicks">
            <dl class="stats">
              {{ stats }}
            </dl>
            <div class="chart-section">
              <div class="card-head">
                <h2>Clicks per day</h2>
                <p class="card-meta">Last {{ chart_days }} days</p>
              </div>
              {{ clicks_chart }}
            </div>
          </section>

          {{ advanced }}
        </div>
      </div>
    </main>
  </div>
</body>
</html>
