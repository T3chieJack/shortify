name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Build a test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          load: true
          tags: shortify:test

      - name: Test the image
        run: |
          docker run -d --name shortify --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges -v shortify-data:/data -p 8080:8080 shortify:test
          for attempt in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8080/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz
          test "$(curl -s -o /dev/null -w '%{redirect_url}' http://127.0.0.1:8080/)" = "http://127.0.0.1:8080/setup"
          docker logs shortify | grep -q "Setup code"
          docker exec shortify cloudflared --version

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Publish the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "Shortify $GITHUB_REF_NAME" --generate-notes
